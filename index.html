
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zero tweet</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #15151d;
  color: #f1f1f7;
  font-family: "Segoe UI", "Meiryo", sans-serif;
}
.layout {
  display: grid;
  grid-template-columns: 220px minmax(300px, 680px) 260px;
  justify-content: center;
  min-height: 100vh;
}
.sidebar, .trends {
  padding: 24px 16px;
  border-right: 1px solid #30303b;
}
.trends {
  border-right: none;
  border-left: 1px solid #30303b;
}
.logo {
  font-size: 25px;
  font-weight: 800;
  color: #7c83ff;
  margin-bottom: 35px;
}
.nav {
  display: block;
  padding: 13px;
  margin: 5px 0;
  color: #eeeef5;
  text-decoration: none;
  border-radius: 12px;
  font-size: 16px;
}
.nav:hover { background: #292938; }
main { border-right: 1px solid #30303b; min-width: 0; }
h2 {
  padding: 20px;
  margin: 0;
  border-bottom: 1px solid #30303b;
}
.composer { padding: 20px; border-bottom: 1px solid #30303b; }
textarea {
  width: 100%;
  min-height: 100px;
  resize: vertical;
  background: #1c1c27;
  color: white;
  border: 1px solid #414154;
  border-radius: 12px;
  padding: 14px;
  font: inherit;
}
button {
  background: #6268f5;
  color: white;
  border: 0;
  border-radius: 20px;
  padding: 10px 22px;
  cursor: pointer;
  font-weight: bold;
}
button:hover { background: #777cff; }
.post-button { display: flex; justify-content: flex-end; margin-top: 12px; }
.post {
  padding: 20px;
  border-bottom: 1px solid #30303b;
  overflow-wrap: anywhere;
}
.post-name { color: #a5a9ff; font-weight: bold; margin-bottom: 10px; }
.post-text { white-space: pre-wrap; line-height: 1.7; }
.post-time { color: #9999ad; font-size: 12px; margin-top: 10px; }
.trend {
  background: #20202b;
  border-radius: 12px;
  padding: 14px;
  margin: 12px 0;
  color: #d5d5e5;
}
.muted { color: #9999ad; font-size: 13px; }
@media (max-width: 900px) {
  .layout { grid-template-columns: 75px minmax(0, 680px); }
  .sidebar { padding: 16px 8px; }
  .logo { font-size: 13px; overflow-wrap: anywhere; }
  .nav { padding: 12px 4px; font-size: 12px; text-align: center; }
  .trends { display: none; }
}
@media (max-width: 480px) {
  .layout { grid-template-columns: 60px minmax(0, 1fr); }
  .nav { font-size: 11px; }
  .composer, .post { padding: 14px; }
}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="logo">Zero tweet</div>
    <a class="nav" href="#">ホーム</a>
    <a class="nav" href="#search">検索</a>
    <a class="nav" href="#feed">タイムライン</a>
    <a class="nav" href="#vc">VC（準備中）</a>
    <a class="nav" href="#profile">プロフィール</a>
    <p class="muted">自分のSNSを作ろう。</p>
  </aside>

  <main>
    <h2>ホーム</h2>
    <section class="composer">
      <p>いまどうしてる？</p>
      <textarea id="postInput" maxlength="500"
        placeholder="ここに投稿内容を入力（500文字まで）"></textarea>
      <div class="post-button">
        <button id="postButton">投稿する</button>
      </div>
      <p id="status" class="muted" aria-live="polite"></p>
    </section>
    <section id="feed"></section>
  </main>

  <aside class="trends" id="search">
    <h3>検索</h3>
    <input id="searchInput" type="search" placeholder="投稿を検索"
      style="width:100%;padding:10px;border-radius:8px;background:#20202b;color:white;border:1px solid #414154">
    <h3>トレンド</h3>
    <div class="trend"># ZeroTweet</div>
    <div class="trend"># はじめまして</div>
    <div class="trend"># 今日の出来事</div>
    <p class="muted">Zero tweet</p>
  </aside>
</div>

<script>
(function () {
  const STORAGE_KEY = "zero-tweet-posts-v1";
  const input = document.getElementById("postInput");
  const feed = document.getElementById("feed");
  const status = document.getElementById("status");
  const searchInput = document.getElementById("searchInput");
  let posts = [];

  function loadPosts() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      posts = saved ? JSON.parse(saved) : [];
      if (!Array.isArray(posts)) posts = [];
    } catch (error) {
      posts = [];
      status.textContent = "保存データを読み込めませんでした。";
    }
  }

  function savePosts() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
      status.textContent = "投稿を保存しました。";
      return true;
    } catch (error) {
      status.textContent = "保存できません。ブラウザの設定を確認してください。";
      return false;
    }
  }

  function renderPosts() {
    const query = searchInput.value.trim().toLowerCase();
    feed.replaceChildren();

    const visiblePosts = posts.filter(function (post) {
      return String(post.text).toLowerCase().includes(query);
    });

    if (visiblePosts.length === 0) {
      const empty = document.createElement("div");
      empty.className = "post muted";
      empty.textContent = query ? "一致する投稿はありません。" : "まだ投稿はありません。";
      feed.appendChild(empty);
      return;
    }

    visiblePosts.forEach(function (post) {
      const article = document.createElement("article");
      article.className = "post";

      const name = document.createElement("div");
      name.className = "post-name";
      name.textContent = "ゲスト　@guest";

      const content = document.createElement("div");
      content.className = "post-text";
      content.textContent = post.text;

      const time = document.createElement("div");
      time.className = "post-time";
      time.textContent = new Date(post.createdAt).toLocaleString("ja-JP");

      article.append(name, content, time);
      feed.appendChild(article);
    });
  }

  document.getElementById("postButton").addEventListener("click", function () {
    const text = input.value.trim();
    if (!text) {
      status.textContent = "投稿内容を入力してください。";
      return;
    }

    posts.unshift({
      text: text,
      createdAt: new Date().toISOString()
    });

    if (!savePosts()) {
      posts.shift();
      return;
    }

    input.value = "";
    renderPosts();
  });

  searchInput.addEventListener("input", renderPosts);

  loadPosts();
  renderPosts();
})();
</script>
</body>
</html>
