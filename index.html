
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zero tweet</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#101318;color:#e8eaf0;font-family:Arial,"Meiryo",sans-serif}
header{position:sticky;top:0;background:#101318ee;border-bottom:1px solid #303640;padding:18px max(16px,calc((100% - 700px)/2));z-index:1}
h1{font-size:23px;margin:0}
main{max-width:700px;margin:auto;padding:20px 14px}
.panel,.post{border:1px solid #303640;border-radius:14px;padding:16px;margin-bottom:16px;background:#171b22}
textarea{width:100%;min-height:105px;resize:vertical;background:#101318;color:#fff;border:1px solid #454d5b;border-radius:9px;padding:12px;font:inherit}
button{background:#8bb7ff;color:#101318;border:0;border-radius:8px;padding:10px 15px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}
.muted{color:#9da7b7;font-size:13px}
.post-body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;margin:14px 0}
.delete{background:transparent;color:#ff9b9b;border:1px solid #754747}
#status{margin:12px 0;color:#b9c9e5;font-size:14px}
</style>
</head>
<body>
<header><h1>Zero tweet</h1></header>
<main>
  <section class="panel">
    <div class="muted">みんなのタイムラインに投稿</div>
    <textarea id="body" maxlength="500" placeholder="今なにしてる？"></textarea>
    <div class="row">
      <span id="count" class="muted">0 / 500</span>
      <button id="send" disabled>投稿する</button>
    </div>
    <div id="status">データベースに接続しています…</div>
  </section>
  <section>
    <div class="row" style="margin-bottom:14px">
      <h2 style="font-size:18px;margin:0">タイムライン</h2>
      <button id="refresh" style="background:#303947;color:#fff">更新</button>
    </div>
    <div id="timeline"></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://pgmpicnzfrkbogkebjbg.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Hr0zhCURXyl9BZpRZmJBQQ_JMf3O84f";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

let currentUser = null;
const bodyInput = document.getElementById("body");
const sendButton = document.getElementById("send");
const statusBox = document.getElementById("status");
const timeline = document.getElementById("timeline");

function setStatus(message) {
  statusBox.textContent = message;
}

bodyInput.addEventListener("input", () => {
  document.getElementById("count").textContent =
    bodyInput.value.length + " / 500";
});

async function start() {
  try {
    const { data: sessionData, error: sessionError } =
      await client.auth.getSession();
    if (sessionError) throw sessionError;

    let session = sessionData.session;
    if (!session) {
      const { data, error } = await client.auth.signInAnonymously();
      if (error) throw error;
      session = data.session;
    }

    if (!session) throw new Error("ログイン情報を取得できませんでした。");
    currentUser = session.user;
    sendButton.disabled = false;
    setStatus("接続しました。投稿できます。");
    await loadPosts();
  } catch (error) {
    console.error(error);
    setStatus("接続できませんでした：" + error.message);
  }
}

async function loadPosts() {
  timeline.replaceChildren();
  const loading = document.createElement("p");
  loading.className = "muted";
  loading.textContent = "読み込み中…";
  timeline.append(loading);

  const { data, error } = await client
    .from("posts")
    .select("id, created_at, body, user_id")
    .order("created_at", { ascending: false })
    .limit(100);

  if (error) {
    timeline.replaceChildren();
    setStatus("投稿を読み込めません：" + error.message);
    return;
  }

  timeline.replaceChildren();
  if (!data.length) {
    const empty = document.createElement("p");
    empty.className = "muted";
    empty.textContent = "まだ投稿はありません。最初の投稿をしてみよう。";
    timeline.append(empty);
    return;
  }

  for (const post of data) {
    const card = document.createElement("article");
    card.className = "post";

    const meta = document.createElement("div");
    meta.className = "muted";
    const date = new Date(post.created_at);
    meta.textContent = date.toLocaleString("ja-JP");

    const message = document.createElement("div");
    message.className = "post-body";
    message.textContent = post.body;

    card.append(meta, message);

    if (post.user_id === currentUser.id) {
      const row = document.createElement("div");
      row.className = "row";
      const own = document.createElement("span");
      own.className = "muted";
      own.textContent = "自分の投稿";

      const remove = document.createElement("button");
      remove.className = "delete";
      remove.textContent = "削除";
      remove.addEventListener("click", async () => {
        if (!confirm("この投稿を削除しますか？")) return;
        remove.disabled = true;
        const { error: deleteError } = await client
          .from("posts")
          .delete()
          .eq("id", post.id)
          .eq("user_id", currentUser.id);

        if (deleteError) {
          alert("削除できませんでした：" + deleteError.message);
          remove.disabled = false;
          return;
        }
        await loadPosts();
      });

      row.append(own, remove);
      card.append(row);
    }

    timeline.append(card);
  }
}

sendButton.addEventListener("click", async () => {
  const message = bodyInput.value.trim();
  if (!message || !currentUser) return;

  sendButton.disabled = true;
  setStatus("投稿しています…");

  try {
    const { error } = await client.from("posts").insert({
      body: message,
      user_id: currentUser.id
    });
    if (error) throw error;

    bodyInput.value = "";
    document.getElementById("count").textContent = "0 / 500";
    setStatus("投稿しました。");
    await loadPosts();
  } catch (error) {
    setStatus("投稿できませんでした：" + error.message);
  } finally {
    sendButton.disabled = false;
  }
});

document.getElementById("refresh").addEventListener("click", loadPosts);
start();
</script>
</body>
</html>
